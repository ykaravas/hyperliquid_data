[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-halo"
version = "0.1.0"
description = "Schematize Allium Hyperliquid DEX trades into Solidus HALO v2.1 CSVs."
requires-python = ">=3.11"
authors = [{ name = "Yiannis Karavas" }]
dependencies = [
    "snowflake-connector-python>=3.7",
    "python-dotenv>=1.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
hyperliquid-halo = "hyperliquid_halo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
